# API: reverse proxy to the Rust server on 127.0.0.1:8080 (used by the web app and the mobile app).
# Replace backend.example.com with the real API domain. Certificates: see deploy/README.md.

# WebSocket upgrade support (chat).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream havoc_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name backend.example.com;
    return 301 https://backend.example.com$request_uri;
}

server {
    # `listen ... http2` works on nginx 1.24 (Ubuntu 24.04) and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Admin accounts are created on the VPS itself (curl to 127.0.0.1:8080), never publicly.
    location = /api/auth/signup {
        return 404;
    }

    # Game statistics PDF uploads (admin). Reports are ~5 MB; the API caps them at 25 MB.
    location = /api/stats/imports {
        client_max_body_size 30m;
        proxy_pass http://havoc_api;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Chat WebSocket: long-lived. The server pings every 25s, so 120s is plenty.
    location = /api/player/chats/ws {
        proxy_pass http://havoc_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Tokens may arrive as ?token=…; keep them out of the access log.
        access_log off;
    }

    location / {
        proxy_pass http://havoc_api;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
