# Web app (admin panel): static files from the React build.
# Certificates: see deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name havoc-admin.cyberboost.io;
    return 301 https://havoc-admin.cyberboost.io$request_uri;
}


server {
    # `listen ... http2` works on nginx 1.24 (Ubuntu 24.04) and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name havoc-admin.cyberboost.io;

    ssl_certificate     /etc/letsencrypt/live/havoc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havoc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Symlink switched by each deploy; nginx follows it per request (no reload needed).
    root /var/www/havoc/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts content-hashed files here: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Client-side routes (/players, /bookings/...) all serve index.html, which must not be
    # cached so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
