# Web app (admin panel): static files from the React build.
# Certificates: see deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name havoc-admin.cyberboost.io;
    return 301 https://havoc-admin.cyberboost.io$request_uri;
}


server {
    # `listen ... http2` works on nginx 1.24 (Ubuntu 24.04) and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name havoc-admin.cyberboost.io;
    # Don't announce the nginx version.
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/havoc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havoc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Content-Security-Policy: the panel only talks to its API, shows images from the API and
    # Bookeo, and can't be framed. Repeated in `location /` (add_header there replaces these).

    # Symlink switched by each deploy; nginx follows it per request (no reload needed).
    root /var/www/havoc/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://havoc-api.cyberboost.io https://*.bookeo.com; font-src 'self' data:; connect-src 'self' https://havoc-api.cyberboost.io wss://havoc-api.cyberboost.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts content-hashed files here: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The players' pages live on policy.havoc-tlt.com only.
    location ~ ^/(privacy|terms|delete-account)/?$ {
        return 404;
    }

    # Client-side routes (/players, /bookings/...) all serve index.html, which must not be
    # cached so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://havoc-api.cyberboost.io https://*.bookeo.com; font-src 'self' data:; connect-src 'self' https://havoc-api.cyberboost.io wss://havoc-api.cyberboost.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
