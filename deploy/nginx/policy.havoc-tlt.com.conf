# Players' policy site: privacy policy, terms of use and account deletion, linked from the app
# and the store listings. Same static build as the admin panel (it shows only these pages on
# this host); nothing else is served here. Certificates: see deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name policy.havoc-tlt.com;
    return 301 https://policy.havoc-tlt.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name policy.havoc-tlt.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/havoc-policy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havoc-policy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/havoc/current;

    # The pages only call the API (account deletion) and show the logo; no framing.
    # Repeated in each location below (add_header there replaces these).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src https://havoc-api.cyberboost.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /privacy;
    }

    # The three pages: index.html, never cached so a deploy shows at once.
    location ~ ^/(privacy|terms|delete-account)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src https://havoc-api.cyberboost.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Content-hashed scripts and styles from the build.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Logo and icons.
    location ~ ^/(logo\.png|logo-light\.png|favicon\.ico|apple-touch-icon\.png|icon-192\.png)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else (the admin panel's paths included) doesn't exist on this host.
    location / {
        return 404;
    }
}
